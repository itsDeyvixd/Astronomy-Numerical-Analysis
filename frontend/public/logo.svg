<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  
  <g transform="translate(100, 100) rotate(-20) translate(-100, -100)">
    <!-- Back of ring -->
    <path d="M 30 100 A 70 25 0 0 1 170 100" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
    
    <!-- Planet body -->
    <circle cx="100" cy="100" r="45" fill="url(#planetGrad)" />
    
    <!-- Front of ring -->
    <path d="M 15 100 A 85 32 0 0 0 185 100" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Grid lines on planet (gives it a computational/numerical vibe) -->
    <path d="M 65 80 Q 100 90 135 80" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.25" />
    <path d="M 58 100 Q 100 115 142 100" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.3" />
    <path d="M 65 120 Q 100 130 135 120" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.25" />
    
    <path d="M 80 60 Q 70 100 80 140" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.25" />
    <path d="M 100 55 Q 90 100 100 145" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.3" />
    <path d="M 120 60 Q 130 100 120 140" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.25" />
  </g>
  
  <!-- Math & Stars -->
  <path d="M 40 30 L 42 38 L 50 40 L 42 42 L 40 50 L 38 42 L 30 40 L 38 38 Z" fill="#14b8a6" opacity="0.9" />
  <path d="M 160 40 L 161 45 L 166 46 L 161 47 L 160 52 L 159 47 L 154 46 L 159 45 Z" fill="#8b5cf6" opacity="0.8" />
  <path d="M 150 160 L 151 164 L 155 165 L 151 166 L 150 170 L 149 166 L 145 165 L 149 164 Z" fill="#3b82f6" opacity="0.9" />
  <circle cx="35" cy="150" r="2" fill="#fff" opacity="0.6" />
  <circle cx="175" cy="120" r="1.5" fill="#fff" opacity="0.4" />
</svg>
